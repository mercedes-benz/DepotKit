name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check SPDX license headers
        run: scripts/check-license-headers.sh

      - name: Check formatting
        run: scripts/format.sh --check

  build:
    name: Build (${{ matrix.platform.name }})
    needs: lint
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            destination: "generic/platform=iOS"
          - name: macOS
            destination: "platform=macOS"
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: >
          xcodebuild build
          -workspace '.'
          -scheme DepotKit
          -destination '${{ matrix.platform.destination }}'
          -skipPackagePluginValidation
          -skipMacroValidation

  test:
    name: Test
    needs: lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # swift test builds and runs on macOS only; iOS compilation is covered by the build matrix.
      - name: Test
        run: swift test --no-parallel
