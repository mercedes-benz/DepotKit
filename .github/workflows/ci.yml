name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check SPDX license headers
        run: scripts/check-license-headers.sh

      - name: Check formatting
        run: scripts/format.sh --check

  build:
    name: Build (${{ matrix.platform.name }}, Xcode ${{ matrix.xcode }})
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.6', '26.3']
        platform:
          - name: iOS
            destination: "platform=iOS Simulator,name=iPhone 17 Pro"
          - name: macOS
            destination: "platform=macOS"
          - name: watchOS
            destination: "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm)"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Build
        run: >
          xcodebuild build
          -workspace '.'
          -scheme DepotKit
          -destination '${{ matrix.platform.destination }}'
          -skipPackagePluginValidation

  test:
    name: Test (Xcode ${{ matrix.xcode }})
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        xcode: ['26.6', '26.3']
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Test
        run: >
          xcodebuild test
          -workspace '.'
          -scheme DepotKit
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -skipPackagePluginValidation
          -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-Xcode-${{ matrix.xcode }}
          path: TestResults.xcresult
