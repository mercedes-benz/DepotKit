name: Documentation

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build DocC
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build documentation archive
        run: >
          xcodebuild docbuild
          -workspace '.'
          -scheme DepotKit
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath .build
          -skipPackagePluginValidation

      - name: Transform for static hosting
        run: |
          ARCHIVE=$(find .build -type d -name "DepotKit.doccarchive" | head -1)
          $(xcrun --find docc) process-archive transform-for-static-hosting "$ARCHIVE" \
            --hosting-base-path "/DepotKit" \
            --output-path docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
