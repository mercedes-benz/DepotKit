name: Stale Issues

on:
  schedule:
    - cron: "0 6 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in
            14 days unless there is new activity.
          stale-pr-message: >
            This pull request has been inactive for 60 days. It will be
            closed in 14 days unless there is new activity.
          exempt-issue-labels: pinned,security,enhancement
          exempt-pr-labels: pinned,security
