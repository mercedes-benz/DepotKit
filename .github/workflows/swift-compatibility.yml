name: Swift Compatibility

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

jobs:
  nightly:
    name: Swift Nightly
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift nightly
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: nightly-main

      - name: Build
        run: swift build

      - name: Test
        run: swift test
